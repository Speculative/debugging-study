[project]
name = "tutorial"
version = "0.1.0"
description = "Debugging study tutorial"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "autopsy",
    "pytest>=8.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv.sources]
autopsy = { path = "../autopsy", editable = true }

[project.entry-points.pytest11]
autopsy = "autopsy.pytest"