[project]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway with rate limiting and quota management"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "autopsy",
    "logger",
    "tracer",
    "pytest>=8.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv.sources]
autopsy = { path = "../autopsy", editable = true }
logger = { path = "../logger", editable = true }
tracer = { path = "../tracer", editable = true }

[project.entry-points.pytest11]
autopsy = "autopsy.pytest"